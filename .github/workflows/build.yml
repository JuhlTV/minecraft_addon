name: Build Plugin

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build plugin
        run: ./mvnw -B clean package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: statsrank-jar
          path: target/statsrank-1.0.0.jar
